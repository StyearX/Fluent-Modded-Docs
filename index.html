    <script>
      (function() {
        var qs = window.location.search;
        if (qs) {
          var match = qs.match(/[?&]p=([^&]*)/);
          if (match) {
            var p = '/' + match[1].replace(/~and~/g, '&');
            var rest = qs.replace(/[?&]p=[^&]*/, '').replace(/[?&]q=([^&]*)/, '?$1');
            history.replaceState(null, null, p + rest + window.location.hash);
          }
        }
      })();
    </script>
